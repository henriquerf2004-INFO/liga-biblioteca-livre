<ion-header>
  <ion-toolbar>
    <ion-title>Biblioteca Livre</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="sair()" color="light">Sair</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <!-- Melhoria Extra: Card com Contador de Livros -->
  <div class="header-card">
    <h2>Painel de Gestão</h2>
    <p>Livros disponíveis para empréstimo: <strong>{{ obterTotalDisponiveis() }}</strong></p>
  </div>

  <ion-text color="success" *ngIf="mensagem">
    <p class="ion-padding-start"><strong>{{ mensagem }}</strong></p>
  </ion-text>

  <ion-list>
    <app-livro-card 
      *ngFor="let livro of livros" 
      [livro]="livro" 
      (emprestarEvent)="emprestarLivro(livro)">
    </app-livro-card>
  </ion-list>

</ion-content>
